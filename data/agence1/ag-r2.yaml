type: router
hostname: AG1-R2

interfaces:
  - port: "fastEthernet 0/0/0"
    desc: Liaison vers AG1-SW-L3b
    ip: 172.16.19.6
    mask: 255.255.255.252
  - port: "fastEthernet 0/0/1"
    desc: Liaison vers AG1-SW-L3a
    ip: 172.16.19.14
    mask: 255.255.255.252
  - port: "fastEthernet 0/0/2"
    desc: Liaison vers AG1-R1
    ip: 172.16.19.10
    mask: 255.255.255.252
  - port: "gigabitEthernet 0/0"
    desc: WAN vers ISP-AG
    ip: 200.0.0.5
