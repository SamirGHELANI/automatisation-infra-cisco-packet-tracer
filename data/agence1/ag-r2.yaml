ospf:
  process: 1
  router_id: 4.4.4.4
  networks:
    - "172.16.19.4 0.0.0.3 area 1"
    - "172.16.19.12 0.0.0.3 area 1"
    - "172.16.19.8 0.0.0.3 area 1"