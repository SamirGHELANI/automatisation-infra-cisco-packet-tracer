type: switch-l3
hostname: AG1-SW-L3a

# Les VLANs
vlans:
  - id: 110
    name: Users
  - id: 120
    name: Voix
  - id: 130
    name: Management

# Les SVI (une IP par VLAN + VRRP)
svis:
  - vlan: 110
    ip: 172.16.16.2
    mask: 255.255.255.0
    vrrp_group: 110
    vrrp_ip: 172.16.16.1
    vrrp_priority: 110          # L3a = priorité haute (master)
    helper: 172.16.67.10        # DHCP relay vers le serveur du siège
  - vlan: 120
    ip: 172.16.17.2
    mask: 255.255.255.0
    vrrp_group: 120
    vrrp_ip: 172.16.17.1
    vrrp_priority: 110
    helper: 172.16.67.10
  - vlan: 130
    ip: 172.16.18.2
    mask: 255.255.255.0
    vrrp_group: 130
    vrrp_ip: 172.16.18.1
    vrrp_priority: 110
    helper: 172.16.67.10

# EtherChannel vers L3b (2 câbles)
etherchannel:
  group: 1
  members: "range fastEthernet 0/3 - 4"
  allowed_vlans: "110,120,130"

# Uplinks trunk vers les switches accès
trunk_ports:
  - port: "fastEthernet 0/1"
    desc: Vers AG1-SW-ACC1
    allowed_vlans: "110,120,130"
  - port: "fastEthernet 0/2"
    desc: Vers AG1-SW-ACC2
    allowed_vlans: "110,120,130"

# Liaison routée vers le routeur (L3, avec OSPF)
routed_links:
  - port: "fastEthernet 0/5"
    desc: Liaison vers AG1-R1
    ip: 172.16.19.1
    mask: 255.255.255.252
  - port: "fastEthernet 0/6"
    desc: Liaison vers AG1-R2
    ip: 172.16.19.13
    mask: 255.255.255.252

# OSPF
ospf:
  process: 1
  router_id: 1.1.1.1
  networks:
    - "172.16.16.0 0.0.0.255 area 1"
    - "172.16.17.0 0.0.0.255 area 1"
    - "172.16.18.0 0.0.0.255 area 1"
    - "172.16.19.0 0.0.0.3 area 1"
    - "172.16.19.12 0.0.0.3 area 1"