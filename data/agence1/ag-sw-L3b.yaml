type: switch-l3
hostname: AG1-SW-L3b

vlans:
  - id: 110
    name: Users
  - id: 120
    name: Voix
  - id: 130
    name: Management

svis:
  - vlan: 110
    ip: 172.16.16.3
    mask: 255.255.255.0
    vrrp_group: 110
    vrrp_ip: 172.16.16.1
    vrrp_priority: 100          # L3b = backup (priorité basse)
    helper: 172.16.67.10
  - vlan: 120
    ip: 172.16.17.3
    mask: 255.255.255.0
    vrrp_group: 120
    vrrp_ip: 172.16.17.1
    vrrp_priority: 100
    helper: 172.16.67.10
  - vlan: 130
    ip: 172.16.18.3
    mask: 255.255.255.0
    vrrp_group: 130
    vrrp_ip: 172.16.18.1
    vrrp_priority: 100
    helper: 172.16.67.10

etherchannel:
  group: 1
  members: "range fastEthernet 0/3 - 4"
  allowed_vlans: "110,120,130"

trunk_ports:
  - port: "fastEthernet 0/1"
    desc: Vers AG1-SW-ACC1
    allowed_vlans: "110,120,130"
  - port: "fastEthernet 0/2"
    desc: Vers AG1-SW-ACC2
    allowed_vlans: "110,120,130"

routed_links:
  - port: "fastEthernet 0/5"
    desc: Liaison vers AG1-R2
    ip: 172.16.19.5
    mask: 255.255.255.252
  - port: "fastEthernet 0/6"
    desc: Liaison vers AG1-R1
    ip: 172.16.19.17
    mask: 255.255.255.252

ospf:
  process: 1
  router_id: 2.2.2.2
  networks:
    - "172.16.16.0 0.0.0.255 area 1"
    - "172.16.17.0 0.0.0.255 area 1"
    - "172.16.18.0 0.0.0.255 area 1"
    - "172.16.19.4 0.0.0.3 area 1"
    - "172.16.19.16 0.0.0.3 area 1"