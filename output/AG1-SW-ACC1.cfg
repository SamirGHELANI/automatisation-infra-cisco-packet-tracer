hostname AG1-SW-ACC1
!
vlan 110
 name Users
vlan 120
 name Voix
vlan 130
 name Management
!
interface range fastEthernet 0/1 - 10
 description Postes utilisateurs
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
interface range fastEthernet 0/11 - 16
 description Telephones IP
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
interface fastEthernet 0/24
 description Management
 switchport mode access
 switchport access vlan 130
 spanning-tree portfast
!
interface gigabitEthernet 0/1
 description Uplink vers AG1-SW-L3a
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
interface gigabitEthernet 0/2
 description Uplink vers AG1-SW-L3b
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
!
interface range fastEthernet 0/17 - 23
 description Ports inutilises
 shutdown
!
interface vlan 130
 ip address 172.16.18.10 255.255.255.0
 no shutdown
!
ip default-gateway 172.16.18.1
!
end