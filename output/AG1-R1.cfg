hostname AG1-R1
!
interface fastEthernet 0/0/0
 description Liaison vers AG1-SW-L3a
 ip address 172.16.19.2 255.255.255.252
 no shutdown
!
interface fastEthernet 0/0/1
 description Liaison vers AG1-SW-L3b
 ip address 172.16.19.18 255.255.255.252
 no shutdown
!
interface fastEthernet 0/0/2
 description Liaison vers AG1-R2
 ip address 172.16.19.9 255.255.255.252
 no shutdown
!
interface gigabitEthernet 0/0
 description WAN vers ISP-AG
 ip address 200.0.0.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 network 172.16.19.0 0.0.0.3 area 1
 network 172.16.19.16 0.0.0.3 area 1
 network 172.16.19.8 0.0.0.3 area 1
!
end