hostname AG1-SW-L3b
!
ip routing
!
vlan 110
 name Users
vlan 120
 name Voix
vlan 130
 name Management
!
interface vlan 110
 ip address 172.16.16.3 255.255.255.0
 ip helper-address 172.16.67.10
 standby 110 ip 172.16.16.1
 standby 110 priority 100
 standby 110 preempt
 no shutdown
!
interface vlan 120
 ip address 172.16.17.3 255.255.255.0
 ip helper-address 172.16.67.10
 standby 120 ip 172.16.17.1
 standby 120 priority 100
 standby 120 preempt
 no shutdown
!
interface vlan 130
 ip address 172.16.18.3 255.255.255.0
 ip helper-address 172.16.67.10
 standby 130 ip 172.16.18.1
 standby 130 priority 100
 standby 130 preempt
 no shutdown
!
interface range fastEthernet 0/3 - 4
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
 channel-group 1 mode active
!
interface port-channel 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
!
interface fastEthernet 0/1
 description Vers AG1-SW-ACC1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
interface fastEthernet 0/2
 description Vers AG1-SW-ACC2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
!
interface fastEthernet 0/5
 description Liaison vers AG1-R2
 no switchport
 ip address 172.16.19.5 255.255.255.252
 no shutdown
!
interface fastEthernet 0/6
 description Liaison vers AG1-R1
 no switchport
 ip address 172.16.19.17 255.255.255.252
 no shutdown
!
!
router ospf 1
 router-id 2.2.2.2
 network 172.16.16.0 0.0.0.255 area 1
 network 172.16.17.0 0.0.0.255 area 1
 network 172.16.18.0 0.0.0.255 area 1
 network 172.16.19.4 0.0.0.3 area 1
 network 172.16.19.16 0.0.0.3 area 1
!
end